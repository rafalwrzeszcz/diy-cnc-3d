<!DOCTYPE html>
<html>
<head>
<style>

html, body {
    border: 0;
    margin: 0;
    background-color: #000000;
    color: #ffffff;
}

.button {
    float: left;
    font-family: "Quicksand Medium", sans-serif;
    font-weight: 500;
    font-size: 4mm;
    box-sizing: border-box;
    border: 0.1mm solid #ffffff;
    border-radius: 1.6mm;
    margin: 1.5mm;
    height: 16mm;
    width: 16.4mm;
    padding: 2mm;
}

.button.cmd {
    width: 21.2mm;
}

</style>
</head>
<body>

<div class="button">
Ctrl
</div>

<div class="button cmd">
Alt
</div>

</body>
</html>
